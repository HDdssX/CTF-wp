<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>稽查长金库</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background: #000;
            color: #ef4444;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .vault-container {
            text-align: center;
            border: 2px dashed #dc2626;
            padding: 50px 80px;
            background: rgba(220, 38, 38, 0.05);
            box-shadow: 0 0 40px rgba(220, 38, 38, 0.2) inset;
            border-radius: 8px;
            position: relative;
            animation: glitchEffect 3s infinite;
        }
        @keyframes glitchEffect {
            0% { box-shadow: 0 0 40px rgba(220, 38, 38, 0.2) inset; }
            50% { box-shadow: 0 0 60px rgba(220, 38, 38, 0.4) inset; }
            100% { box-shadow: 0 0 40px rgba(220, 38, 38, 0.2) inset; }
        }
        h1 {
            font-size: 2.5em;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 0;
        }
        .flag-box {
            font-size: 1.5em;
            background: rgba(220, 38, 38, 0.1);
            padding: 20px 40px;
            border: 1px solid #dc2626;
            margin: 30px 0;
            word-break: break-all;
            color: #fca5a5;
        }
        .auth-label {
            position: absolute;
            top: 10px; right: 10px;
            font-size: 0.8em;
            background: #dc2626;
            color: #000;
            padding: 2px 8px;
            font-weight: bold;
        }
        a {
            color: #fca5a5;
            text-decoration: none;
            border-bottom: 1px solid #dc2626;
            padding-bottom: 2px;
            transition: color 0.3s;
        }
        a:hover { color: #fff; border-color: #fff; }
    </style>
</head>
<body>
    <div class="vault-container">
        <div class="auth-label">授权级别: TAX_INSPECT或更高</div>
        <h1>机密金库</h1>
        <p>您已成功突破稽查员许可级别。</p>
        
        <div class="flag-box">
            {{ flag }}
        </div>
        
        <a href="/dashboard">返回主区域</a>
    </div>
</body>
</html>
