<!doctype html><html lang="en"><head><meta charset="utf-8"><title>UMDCTF 2026</title><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="shortcut icon" href="https:&#x2F;&#x2F;redpwn.storage.googleapis.com&#x2F;branding&#x2F;rctf-favicon.ico"><meta name="title" content="UMDCTF 2026"><meta name="description" content="UMDCTF 2026"><meta property="og:type" content="website"><meta property="og:title" content="UMDCTF 2026"><meta property="og:image" content="https:&#x2F;&#x2F;static.umdctf.io&#x2F;logo-2026.png"><meta property="og:description" content="UMDCTF 2026"><meta property="og:url" content="https:&#x2F;&#x2F;umdctf.io"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="UMDCTF 2026"><meta name="twitter:description" content="UMDCTF 2026"><meta name="twitter:image" content="https:&#x2F;&#x2F;static.umdctf.io&#x2F;logo-2026.png"><meta name="twitter:url" content="https:&#x2F;&#x2F;umdctf.io"><link rel="canonical" href="https:&#x2F;&#x2F;umdctf.io"/><meta name="theme-color" content="#111111"><style>html,body,#app{height: 100%;width: 100%;overflow-x: hidden}</style><meta name="rctf-config" content="{&quot;meta&quot;:{&quot;description&quot;:&quot;UMDCTF 2026&quot;,&quot;imageUrl&quot;:&quot;https:&#x2F;&#x2F;static.umdctf.io&#x2F;logo-2026.png&quot;},&quot;homeContent&quot;:&quot;&lt;div style&#x3D;\&quot;display: flex; justify-content: center\&quot;&gt;\n  &lt;img style&#x3D;\&quot;max-width: 50%; max-height: 40vh;\&quot; src&#x3D;\&quot;https:&#x2F;&#x2F;static.umdctf.io&#x2F;logo-2026.png\&quot; &#x2F;&gt;\n&lt;&#x2F;div&gt;\n\n&lt;timer&gt;&lt;&#x2F;timer&gt;\n\n# Welcome to UMDCTF 2026!\n&lt;style&gt;\n.c0120 {\n  padding: 16px !important;\n  color: #fff;\n  background: #222;\n  box-shadow: rgba(250,250,250,0.6) 0px 0px 1rem 0px;\n  font-size: 20px;\n  border-radius: 1rem;\n  text-align: center;\n  transition: box-shadow ease-in-out 0.2s, transform ease-in-out 0.2s;\n  margin: 20px auto;\n}\n.c0120:hover {\n  box-shadow: rgba(250,250,250,0.6) 0px 0px 1.1rem 0px;\n  transform: scale(1.1);\n  color: #fff;\n}\n&lt;&#x2F;style&gt;\n&lt;div class&#x3D;\&quot;row\&quot;&gt;\n  &lt;a class&#x3D;\&quot;c0120\&quot; href&#x3D;\&quot;&#x2F;register\&quot;&gt;Register Now&lt;&#x2F;a&gt;\n  &lt;a class&#x3D;\&quot;c0120\&quot; href&#x3D;\&quot;https:&#x2F;&#x2F;discord.gg&#x2F;n65kg6KuYH\&quot;&gt;Join our Discord&lt;&#x2F;a&gt;\n&lt;&#x2F;div&gt;\n\n&lt;h2 id&#x3D;\&quot;rules\&quot;&gt;Rules&lt;&#x2F;h2&gt;\n&lt;ol&gt;\n  &lt;li&gt;Do not attack the infrastructure. This includes csec.umd.edu, the umdctf.io platform, and any external communication channels or other platforms associated with UMDCTF.&lt;&#x2F;li&gt;\n  &lt;li&gt;All flags are of the format &#x60;UMDCTF{[a-zA-Z0-9_,.&#39;\&quot;?!@$&lt;&gt;*:\\-+ ~#^%\\&#x2F;\\)\\(|\\\\&amp;&#x3D;]+}&#x60; unless otherwise noted in the challenge description. Do not bruteforce flags.&lt;&#x2F;li&gt;\n  &lt;li&gt;Be respectful - regardless of skill level or any other factor. We will not tolerate derogatory and discriminatory language or behavior of any kind.&lt;&#x2F;li&gt;\n  &lt;li&gt;Make a good-faith attempt on challenges before asking for help from UMDCTF organizers&#x2F;developers (i.e: no begging for flags).&lt;&#x2F;li&gt;\n  &lt;li&gt;Do not ask for help on challenges outside of tickets. Competitors should report unsolicited help requests in tickets.&lt;&#x2F;li&gt;\n  &lt;li&gt;Only collaborate with the people in your team. Do not share flags or methodology outside of your team until the end of UMDCTF.&lt;&#x2F;li&gt;\n  &lt;li&gt;Do not bruteforce the online infrastructure - it is not necessary for any challenge. This means no dirbuster, sqlmap, or any other similar software.&lt;&#x2F;li&gt;\n  &lt;li&gt;There is no team size limit.&lt;&#x2F;li&gt;\n&lt;&#x2F;ol&gt;\n\n&lt;h2&gt;Prizes&lt;&#x2F;h2&gt;\n&lt;h3&gt;Open Division&lt;&#x2F;h3&gt;\n&lt;ul&gt;\n  &lt;li&gt;&lt;b&gt;1st place:&lt;&#x2F;b&gt; $100, 1 Ida Pro Expert-4 License, Hex-Rays swag, 1 Binary Ninja Personal License, 1 year OffSec Proving Grounds Access&lt;&#x2F;li&gt;\n  &lt;li&gt;&lt;b&gt;2nd place:&lt;&#x2F;b&gt; $90, 1 Ida Pro Expert-4 License, 1 Binary Ninja Personal License&lt;&#x2F;li&gt;\n  &lt;li&gt;&lt;b&gt;3rd place:&lt;&#x2F;b&gt; $75, 1 Ida Pro Expert-4 License, 1 Binary Ninja Personal License&lt;&#x2F;li&gt;\n  &lt;li&gt;&lt;b&gt;4th place:&lt;&#x2F;b&gt; $50&lt;&#x2F;li&gt;\n  &lt;li&gt;&lt;b&gt;5th place:&lt;&#x2F;b&gt; $25&lt;&#x2F;li&gt;\n&lt;&#x2F;ul&gt;\n&lt;h3&gt;Student Division&lt;&#x2F;h3&gt;\n&lt;ul&gt;\n  &lt;li&gt;&lt;b&gt;1st place:&lt;&#x2F;b&gt; $80, 1 Ida Pro Expert-4 License, 1 Binary Ninja Personal License, 1 year OffSec Proving Grounds Access&lt;&#x2F;li&gt;\n  &lt;li&gt;&lt;b&gt;2nd place:&lt;&#x2F;b&gt; $65, 1 Ida Pro Expert-4 License, 1 Binary Ninja Personal License&lt;&#x2F;li&gt;\n  &lt;li&gt;&lt;b&gt;3rd place:&lt;&#x2F;b&gt; $50&lt;&#x2F;li&gt;\n  &lt;li&gt;&lt;b&gt;4th place:&lt;&#x2F;b&gt; $40&lt;&#x2F;li&gt;\n  &lt;li&gt;&lt;b&gt;5th place:&lt;&#x2F;b&gt; $25&lt;&#x2F;li&gt;\n&lt;&#x2F;ul&gt;\n&lt;p&gt;&lt;i&gt;To qualify for Student division prizes, all team members must be either current graduate&#x2F;undergraduate students at a recognized university&#x2F;college, or current high school&#x2F;middle school students.&lt;&#x2F;i&gt;&lt;&#x2F;p&gt;\n&lt;h3&gt;Writeup Prizes&lt;&#x2F;h3&gt;\n&lt;ul&gt;\n  &lt;li&gt;$2400 split amongst the best writeups&lt;&#x2F;li&gt;\n  &lt;li&gt;&lt;b&gt;Best Binary Ninja Writeup:&lt;&#x2F;b&gt; 1 Binary Ninja Personal License&lt;&#x2F;li&gt;\n&lt;&#x2F;ul&gt;\n\n## Sponsors\n&lt;sponsors&gt;&lt;&#x2F;sponsors&gt;&quot;,&quot;sponsors&quot;:[{&quot;name&quot;:&quot;Trail of Bits&quot;,&quot;icon&quot;:&quot;https:&#x2F;&#x2F;static.umdctf.io&#x2F;tob.jpg&quot;,&quot;description&quot;:&quot;&lt;a href&#x3D;\&quot;https:&#x2F;&#x2F;www.trailofbits.com&#x2F;\&quot;&gt;Trail of Bits&lt;&#x2F;a&gt; helps secure the world&#39;s most targeted organizations and products. We combine high-end security research with a real-world attacker mentality to reduce risk and fortify code.\n&quot;},{&quot;name&quot;:&quot;Zellic&quot;,&quot;icon&quot;:&quot;https:&#x2F;&#x2F;static.umdctf.io&#x2F;zellic.svg&quot;,&quot;description&quot;:&quot;Zellic is a security research firm. We hire top CTF talent to solve the world&#39;s most critical security problems. Before Zellic, we founded perfect blue, the #1 CTF team in 2020 and 2021. We hire internationally, and we look for people experienced in vulnerability research (VR) &#x2F; binary exploitation, reverse engineering (RE), cryptography, or web security. To learn more about Zellic, check out our &lt;a href&#x3D;\&quot;https:&#x2F;&#x2F;www.zellic.io&#x2F;blog&#x2F;the-auditooor-grindset\&quot;&gt;blog&lt;&#x2F;a&gt;.\n&quot;},{&quot;name&quot;:&quot;OffSec&quot;,&quot;icon&quot;:&quot;https:&#x2F;&#x2F;static.umdctf.io&#x2F;offsec.png&quot;,&quot;description&quot;:&quot;OffSec is a global leader in cybersecurity education, built on a commitment to excellence, integrity, and growth. The &lt;a href&#x3D;\&quot;https:&#x2F;&#x2F;www.offsec.com&#x2F;community&#x2F;ugc&#x2F;\&quot;&gt;OffSec User Generated Content Program&lt;&#x2F;a&gt; is a space built for creators like you. Turn your ideas into real labs that thousands of learners worldwide will use to practice and grow their skills.\n&quot;},{&quot;name&quot;:&quot;Vector35&quot;,&quot;icon&quot;:&quot;https:&#x2F;&#x2F;static.umdctf.io&#x2F;binja.png&quot;,&quot;description&quot;:&quot;&lt;a href&#x3D;\&quot;https:&#x2F;&#x2F;binary.ninja&#x2F;\&quot;&gt;Binary Ninja&lt;&#x2F;a&gt; is an interactive decompiler, disassembler, debugger, and binary analysis platform built by reverse engineers, for reverse engineers. Binary Ninja is actively used by malware analysts, vulnerability researchers, and software developers worldwide.\n&quot;},{&quot;name&quot;:&quot;Hex-Rays&quot;,&quot;icon&quot;:&quot;https:&#x2F;&#x2F;static.umdctf.io&#x2F;hex-rays.svg&quot;,&quot;description&quot;:&quot;&lt;a href&#x3D;\&quot;https:&#x2F;&#x2F;hex-rays.com&#x2F;\&quot;&gt;IDA&lt;&#x2F;a&gt; is the leading tool for binary analysis, trusted by top cybersecurity teams for reverse engineering and malware defense. Simplify complex binaries and boost your security processes with its advanced analysis features.\n&quot;},{&quot;name&quot;:&quot;Google Cloud&quot;,&quot;icon&quot;:&quot;https:&#x2F;&#x2F;static.umdctf.io&#x2F;gcloud.svg&quot;,&quot;description&quot;:&quot;Infrastructure sponsored by &lt;a href&#x3D;\&quot;https:&#x2F;&#x2F;goo.gle&#x2F;ctfsponsorship\&quot;&gt;https:&#x2F;&#x2F;goo.gle&#x2F;ctfsponsorship&lt;&#x2F;a&gt;\n&quot;}],&quot;ctfName&quot;:&quot;UMDCTF 2026&quot;,&quot;divisions&quot;:{&quot;open&quot;:&quot;Open&quot;,&quot;student&quot;:&quot;Student&quot;},&quot;origin&quot;:&quot;https:&#x2F;&#x2F;umdctf.io&quot;,&quot;startTime&quot;:1777068000000,&quot;endTime&quot;:1777240800000,&quot;faviconUrl&quot;:&quot;https:&#x2F;&#x2F;redpwn.storage.googleapis.com&#x2F;branding&#x2F;rctf-favicon.ico&quot;,&quot;emailEnabled&quot;:true,&quot;userMembers&quot;:true,&quot;registrationsEnabled&quot;:true}"/></head><body><div id="app"/><script defer="defer" src="/assets/main.45dad065d4d6dc92e061-1.js"></script></body></html>
