<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录</title>
  <style>
    /* 基础样式重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    body {
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* 登录卡片样式 */
    .login-container {
      position: relative;
      width: 400px;
      background-color: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      z-index: 10;
      overflow: hidden;
      transition: transform 0.5s;
    }

    .login-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(to bottom right,
          rgba(255, 255, 255, 0.1) 0%,
          rgba(255, 255, 255, 0) 50%);
      transform: rotate(30deg);
      pointer-events: none;
    }

    .login-container:hover {
      transform: translateY(-5px);
    }

    /* 标题样式 */
    .login-header {
      text-align: center;
      margin-bottom: 40px;
      color: white;
    }

    .login-header h1 {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .login-header p {
      font-size: 1rem;
      opacity: 0.8;
    }

    /* 输入框样式 */
    .input-group {
      position: relative;
      margin-bottom: 30px;
    }

    .input-group input {
      width: 100%;
      padding: 15px 20px;
      background-color: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      color: white;
      outline: none;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .input-group input:focus {
      background-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .input-group label {
      position: absolute;
      left: 20px;
      top: 15px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 1rem;
      pointer-events: none;
      transition: all 0.3s;
    }

    .input-group input:focus+label,
    .input-group input:not(:placeholder-shown)+label {
      transform: translateY(-35px);
      font-size: 0.8rem;
      color: white;
      opacity: 0.9;
    }

    /* 记住我 & 忘记密码 */
    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.8);
    }

    .remember-me {
      display: flex;
      align-items: center;
    }

    .remember-me input {
      margin-right: 8px;
      accent-color: white;
    }

    .forgot-password a {
      color: white;
      text-decoration: none;
      transition: opacity 0.3s;
    }

    .forgot-password a:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    /* 登录按钮 */
    .login-button {
      width: 100%;
      padding: 15px;
      background-color: white;
      color: #e73c7e;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .login-button:hover {
      background-color: rgba(255, 255, 255, 0.9);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .login-button:active {
      transform: translateY(0);
    }

    /* 注册链接 */
    .signup-link {
      text-align: center;
      margin-top: 30px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.9rem;
    }

    .signup-link a {
      color: white;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.3s;
    }

    .signup-link a:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    /* 装饰元素 */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.1);
      pointer-events: none;
      animation: float 15s infinite linear;
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
      }

      100% {
        transform: translateY(-1000px) rotate(720deg);
      }
    }

    /* 响应式设计 */
    @media (max-width: 480px) {
      .login-container {
        width: 90%;
        padding: 30px 20px;
      }

      .login-header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>
  <!-- 背景气泡 -->
  <div id="bubbles"></div>

  <!-- 登录卡片 -->
  <div class="login-container">
    <div class="login-header">
      <h1>欢迎回来</h1>
      <p>请登录您的账户继续</p>
    </div>

    <form action="/doLogin" method="post">
      <div class="input-group">
        <input type="text" id="username" name="username" placeholder=" " required>
        <label for="username">用户名</label>
      </div>

      <div class="input-group">
        <input type="password" id="password" name="password" placeholder=" " required>
        <label for="password">密码</label>
      </div>

      <div class="login-options">
        <div class="remember-me">
          <input type="checkbox" id="remember">
          <label for="remember">记住我</label>
        </div>
        <div class="forgot-password">
          <a href="#">忘记密码?</a>
        </div>
      </div>

      <button type="submit" class="login-button">登 录</button>

      <div class="signup-link">
        还没有账户? <a href="#">立即注册</a>
      </div>
    </form>
  </div>

  <script>
    // 创建背景气泡
    function createBubbles() {
      const bubblesContainer = document.getElementById('bubbles');
      const bubbleCount = 15;

      for (let i = 0; i < bubbleCount; i++) {
        const bubble = document.createElement('div');
        bubble.classList.add('bubble');

        // 随机大小 (10px - 100px)
        const size = Math.random() * 90 + 10;
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;

        // 随机位置
        bubble.style.left = `${Math.random() * 100}vw`;
        bubble.style.bottom = `-${size}px`;

        // 随机动画延迟和持续时间
        const delay = Math.random() * 15;
        const duration = Math.random() * 20 + 10;
        bubble.style.animationDelay = `${delay}s`;
        bubble.style.animationDuration = `${duration}s`;

        // 随机透明度
        bubble.style.opacity = Math.random() * 0.4 + 0.1;

        bubblesContainer.appendChild(bubble);
      }
    }

    // 输入框动画效果
    function setupInputAnimations() {
      const inputs = document.querySelectorAll('.input-group input');

      inputs.forEach(input => {
        // 添加焦点/失去焦点时的类
        input.addEventListener('focus', function () {
          this.parentElement.classList.add('focused');
        });

        input.addEventListener('blur', function () {
          if (!this.value) {
            this.parentElement.classList.remove('focused');
          }
        });

        // 预填充检查
        if (input.value) {
          input.parentElement.classList.add('focused');
        }
      });
    }

    // 表单提交处理
    function setupFormSubmit() {
      const form = document.querySelector('form');

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        // 模拟登录过程
        const loginButton = document.querySelector('.login-button');
        const originalText = loginButton.textContent;

        loginButton.textContent = '登录中...';
        loginButton.disabled = true;

        // 模拟网络请求
        setTimeout(() => {
          loginButton.textContent = '登录成功!';
          loginButton.style.backgroundColor = '#4CAF50';

          setTimeout(() => {
            loginButton.textContent = originalText;
            loginButton.disabled = false;
            loginButton.style.backgroundColor = 'white';

            // 这里可以添加实际的重定向逻辑
            // window.location.href = 'dashboard.html';
          }, 1500);
        }, 2000);
      });
    }

    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', () => {
      createBubbles();
      setupInputAnimations();
      setupFormSubmit();

      // 添加鼠标移动视差效果
      document.addEventListener('mousemove', (e) => {
        const x = e.clientX / window.innerWidth;
        const y = e.clientY / window.innerHeight;

        const loginContainer = document.querySelector('.login-container');
        loginContainer.style.transform = `translate(${x * 10 - 5}px, ${y * 10 - 5}px)`;
      });
    });
  </script>
</body>

</html>
