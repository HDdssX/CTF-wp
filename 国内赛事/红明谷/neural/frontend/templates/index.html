<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuralChat - AI Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M8 12l2 2 4-4"/>
                    </svg>
                    <span>NeuralChat</span>
                </div>
                <button class="btn-new-chat" onclick="newSession()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Chat
                </button>
            </div>
            <div class="session-list" id="sessionList"></div>
            <div class="sidebar-footer">
                <button class="btn-secondary" onclick="uploadKnowledge()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    Upload Knowledge
                </button>
                <button class="btn-secondary" onclick="exportSession()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Export Chat
                </button>
                <div class="model-badge" id="modelBadge">Loading model info...</div>
            </div>
        </aside>

        <!-- Main chat area -->
        <main class="chat-main">
            <div class="chat-header">
                <h1 id="chatTitle">NeuralChat</h1>
                <span class="status-badge" id="statusBadge">●  Connecting...</span>
            </div>

            <div class="messages" id="messages">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">🧠</div>
                    <h2>Welcome to NeuralChat</h2>
                    <p>Powered by NeuralChat-7B, your advanced AI conversation partner.</p>
                    <div class="feature-grid">
                        <div class="feature-card" onclick="sendQuick('Tell me about yourself')">
                            <span class="feature-icon">💬</span>
                            <span>About this AI</span>
                        </div>
                        <div class="feature-card" onclick="sendQuick('What can you help me with?')">
                            <span class="feature-icon">🚀</span>
                            <span>Capabilities</span>
                        </div>
                        <div class="feature-card" onclick="sendQuick('Tell me about your model architecture')">
                            <span class="feature-icon">🏗️</span>
                            <span>Architecture</span>
                        </div>
                        <div class="feature-card" onclick="sendQuick('What is your version?')">
                            <span class="feature-icon">📋</span>
                            <span>Version Info</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <textarea id="messageInput" placeholder="Send a message..." rows="1"
                              onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
                    <button class="btn-send" onclick="sendMessage()" id="sendBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
                <p class="disclaimer">NeuralChat v2.1 — Responses are AI-generated.</p>
            </div>
        </main>
    </div>

    <!-- Hidden file input -->
    <input type="file" id="fileInput" style="display:none" onchange="handleFileUpload(event)">

    <script>
    let currentSessionId = null;
    let sessions = [];

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
        await checkStatus();
        await loadModelInfo();
        await loadSessions();
    });

    async function checkStatus() {
        try {
            const resp = await fetch('/api/status');
            const data = await resp.json();
            document.getElementById('statusBadge').innerHTML = '● Online';
            document.getElementById('statusBadge').classList.add('online');
        } catch {
            document.getElementById('statusBadge').innerHTML = '● Offline';
            document.getElementById('statusBadge').classList.add('offline');
        }
    }

    async function loadModelInfo() {
        try {
            const resp = await fetch('/api/model/info');
            const data = await resp.json();
            document.getElementById('modelBadge').textContent =
                `${data.name || 'neuralchat-7b'} v${data.version || '2.1'}`;
        } catch {
            document.getElementById('modelBadge').textContent = 'Model unavailable';
        }
    }

    async function loadSessions() {
        try {
            const resp = await fetch('/api/sessions');
            sessions = await resp.json();
            renderSessionList();
        } catch { }
    }

    function renderSessionList() {
        const list = document.getElementById('sessionList');
        list.innerHTML = sessions.map(s => `
            <div class="session-item ${s.id === currentSessionId ? 'active' : ''}"
                 onclick="switchSession(${s.id})">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                </svg>
                <span>Chat ${s.id}</span>
                <small>${s.messages} msgs</small>
            </div>
        `).join('');
    }

    async function newSession() {
        try {
            const resp = await fetch('/api/session/new', { method: 'POST' });
            const data = await resp.json();
            currentSessionId = data.session_id;
            document.getElementById('messages').innerHTML = '';
            document.getElementById('welcomeScreen')?.remove();
            document.getElementById('chatTitle').textContent = `Chat ${currentSessionId}`;
            await loadSessions();
        } catch (e) {
            alert('Failed to create session: ' + e);
        }
    }

    function switchSession(sid) {
        currentSessionId = sid;
        document.getElementById('chatTitle').textContent = `Chat ${sid}`;
        renderSessionList();
        // In a full implementation, would load session messages here
    }

    function addMessage(role, content) {
        const welcome = document.getElementById('welcomeScreen');
        if (welcome) welcome.style.display = 'none';

        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.innerHTML = `
            <div class="message-avatar">${role === 'user' ? '👤' : '🧠'}</div>
            <div class="message-content">
                <div class="message-role">${role === 'user' ? 'You' : 'NeuralChat'}</div>
                <div class="message-text">${escapeHtml(content)}</div>
            </div>
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function addTypingIndicator() {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'message assistant typing-indicator';
        div.id = 'typingIndicator';
        div.innerHTML = `
            <div class="message-avatar">🧠</div>
            <div class="message-content">
                <div class="message-role">NeuralChat</div>
                <div class="message-text"><span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
            </div>
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function removeTypingIndicator() {
        document.getElementById('typingIndicator')?.remove();
    }

    function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const msg = input.value.trim();
        if (!msg) return;

        if (!currentSessionId) await newSession();

        addMessage('user', msg);
        input.value = '';
        autoResize(input);
        addTypingIndicator();

        try {
            const resp = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: currentSessionId, message: msg })
            });
            const data = await resp.json();
            removeTypingIndicator();
            addMessage('assistant', data.response || data.error || 'No response');
            await loadSessions();
        } catch (e) {
            removeTypingIndicator();
            addMessage('assistant', 'Error: ' + e);
        }
    }

    function sendQuick(msg) {
        document.getElementById('messageInput').value = msg;
        sendMessage();
    }

    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 150) + 'px';
    }

    function uploadKnowledge() {
        document.getElementById('fileInput').click();
    }

    async function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);

        try {
            const resp = await fetch('/api/knowledge/upload', {
                method: 'POST',
                body: formData
            });
            const data = await resp.json();
            alert(`File uploaded: ${data.filename}\nPath: ${data.path}`);
        } catch (e) {
            alert('Upload failed: ' + e);
        }
        event.target.value = '';
    }

    async function exportSession() {
        if (!currentSessionId) {
            alert('No active session to export');
            return;
        }
        try {
            const resp = await fetch('/api/export', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: currentSessionId })
            });
            const data = await resp.json();
            if (data.download_url) {
                window.open(data.download_url, '_blank');
            }
        } catch (e) {
            alert('Export failed: ' + e);
        }
    }
    </script>
</body>
</html>
