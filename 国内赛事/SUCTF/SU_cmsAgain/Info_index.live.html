<script type="text/javascript">
//批量删除
function BatchDel(){
	var arrChk = $("input[name='InfoID[]']");
	var n = 0;
	for(var i = 0; i < arrChk.length; i++){
		if(arrChk[i].checked) n++;
	}
	
	if( n == 0 ) {
		WarnBox("请先选中要删除的记录！");
		return;
	}
	
	ConfirmBox("<div id='icon_delete'>确定删除吗？删除后将无法恢复</div>", function () {
		var showall = "0";
		showall = (showall==0) ? 1 : 0; //是否显示所有频道
		$('#frmInfo').attr("action", "/index.php/Member/info/batchDel/showall/"+showall);
		$('#frmInfo').submit();
	});
}

//排序
function BatchSort(){
	ConfirmBox("<div id='icon_sort'>确定保存排序吗？</div>", function () {
		$('#frmInfo').attr("action", "/index.php/Member/info/batchSort");
		$('#frmInfo').submit();
	});
}

$(document).ready(function(){
	$(".TagTip").powerFloat({
			targetMode: "ajax",
			targetAttr: "alt"
	});
		
	$('#attr').click(function(){
		var arrChk = $("input[name='InfoID[]']");
		var n = 0;
		for(var i = 0; i < arrChk.length; i++){
			if(arrChk[i].checked) n++;
		}
		
		if( n == 0 ) {
			WarnBox("请先选中记录!");
			return;
		}
		
		dialog({
			title: "批量设置属性",
			id: 'dlgAttr',
			padding: 8,
			content: document.getElementById('dlgAttr'),
			ok: function () {
				$("#dlgAttr").appendTo("form#frmInfo");
				$('#frmInfo').attr("action", "/index.php/Member/info/batchLabel");
				$('#frmInfo').submit();
			},
			okValue: '确定',
			cancelValue: '关闭',
			cancel: true
		}).show();
		return false;
	});
	
	$('#move').click(function(){
		var arrChk = $("input[name='InfoID[]']");
		var n = 0;
		for(var i = 0; i < arrChk.length; i++){
			if(arrChk[i].checked) n++;
		}
		
		if( n == 0 ) {
			WarnBox("请先选中记录!");
			return;
		}
		
		dialog({
			title: "批量移动",
			id: 'dialog',
			padding: 8,
			content: document.getElementById('dialog'),
			ok: function () {
				var hasChild = $("#cid").children("option:selected").attr("hasChild");
				if(hasChild==1){
					$("#cidtip").text("只能移动到子频道！");
					return false;
				}
				var cmid = $("#cid").children("option:selected").attr("cmid");
				if(cmid==32){
					$("#cidtip").text("不能移动到单页频道！");
					return false;
				}
				if(cmid==33){
					$("#cidtip").text("不能移动到链接频道！");
					return false;
				}
				$("#dialog").appendTo("form#frmInfo");
				$('#frmInfo').attr("action", "/index.php/Member/info/batchMove");
				$('#frmInfo').submit();
			},
			okValue: '确定',
			cancelValue: '关闭',
			cancel: true
		}).show();
		return false;
	});
});

function Add(){
	var showall = "0";
	showall = (showall==0) ? 1 : 0; //是否显示所有频道
	dialog({
		title: "请选择频道",
		id: 'dlgSelect',
		padding: 8,
		content: document.getElementById('dlgSelect'),
		ok: function () {
			var hasChild = $("#selectcid").children("option:selected").attr("hasChild");
			if(hasChild==1){
				$("#selecttip").text("请选择子频道发布文章！");
				return false;
			}
			var cmid = $("#selectcid").children("option:selected").attr("cmid");
			if(cmid==32){
				$("#selecttip").text("不能在单页频道发布文章！");
				return false;
			}
			if(cmid==33){
				$("#selecttip").text("不能在链接频道发布文章！");
				return false;
			}
			var cid = $("#selectcid").val();
			location.href = "/index.php/Member/info/add/ChannelID/"+cid+"/showall/"+showall;
		},
		okValue: '确定',
		cancelValue: '关闭',
		cancel: true
	}).show();
}

function Del(id, ChannelID){
	ConfirmBox("<div id='icon_delete'>确定删除吗？删除后将无法恢复</div>", function () {
		var showall = "0";
		showall = (showall==0) ? 1 : 0; //是否显示所有频道
		url = "/index.php/Member/info/del/InfoID/"+id+"/ChannelID/"+ChannelID+"/p/1/showall/"+showall;;
		location.href = url;
	});
}

function Edit(id, ChannelID){
	var showall = "0";
	showall = (showall==0) ? 1 : 0; //是否显示所有频道
	var url = "/index.php/Member/info/modify/InfoID/"+id+"/ChannelID/"+ChannelID+"/showall/"+showall;
	location.href = url;
}

//查询
function Search(){
	var cid = $("#searchcid").val();
	var action = (cid==0) ? "/index.php/Member/info/index" : "/index.php/Member/info/index/ChannelID/"+cid;
	$('#frmInfo').attr("action", action);
	$('#frmInfo').submit();
	return true;
}
</script>
