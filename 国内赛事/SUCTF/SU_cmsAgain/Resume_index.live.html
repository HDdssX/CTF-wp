<script type="text/javascript">
function Del(id){
	ConfirmBox("<div id='icon_delete'>确定删除吗？删除后将无法恢复</div>", function () {
		url = "/index.php/Member/resume/delResume/ResumeID/"+id+"/p/1";
		location.href = url;
	});
}

//批量删除
function BatchDel(){
	//var arrChk = $("input[name='InfoID[]'][checked]"); //在高速浏览器长度总是返回0
	var arrChk = $("input[name='ResumeID[]']");
	var n = 0;
	for(var i = 0; i < arrChk.length; i++){
		if(arrChk[i].checked) n++;
	}
	
	if( n == 0 ) {
		WarnBox("请先选中要删除的记录！");
		return;
	}
	
	ConfirmBox("<div id='icon_delete'>确定删除吗？删除后将无法恢复</div>", function () {
		$('#frm').attr("action", "/index.php/Member/resume/batchDelResume");
		$('#frm').submit();
	});
}
</script>
