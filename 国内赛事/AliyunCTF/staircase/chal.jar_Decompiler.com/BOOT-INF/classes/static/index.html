<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件管理系统</title>
    <style>
        /* 基础样式重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        /* 头部样式 */
        header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
            position: relative;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
            font-weight: 300;
            position: relative;
        }

        /* 主面板布局 */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            padding: 40px;
        }

        /* 卡片样式 */
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3498db, #2ecc71, #e74c3c);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .card h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.4em;
            font-weight: 600;
            border-bottom: 2px solid #f8f9fa;
            padding-bottom: 10px;
        }

        /* 文件信息区域 */
        .file-info {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #3498db;
        }

        .file-icon {
            font-size: 2.5em;
            margin-right: 20px;
            background: #3498db;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-details h3 {
            font-size: 1.3em;
            margin-bottom: 5px;
            transition: color 0.3s ease;
        }

        .file-details p {
            color: #7f8c8d;
            font-size: 0.9em;
        }

        /* 按钮样式 */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }

        .btn-success:hover {
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #e67e22, #d35400);
        }

        .btn-warning:hover {
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.4);
        }

        .btn-block {
            display: block;
            width: 100%;
            margin-top: 15px;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 0.95em;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
            background: white;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        /* 字符串输入容器特殊样式 */
        .string-input-container {
            margin: 25px 0;
            position: relative;
        }

        #stringInput {
            border: 2px solid #bdc3c7;
            background: white;
            transition: all 0.3s ease;
        }

        #stringInput:focus {
            border-color: #9b59b6;
            box-shadow: 0 0 0 3px rgba(155, 89, 182, 0.1);
        }

        .length-indicator {
            text-align: right;
            font-size: 0.85em;
            color: #7f8c8d;
            margin-top: 5px;
            transition: color 0.3s ease;
        }

        .length-indicator.length-warning {
            color: #e74c3c;
            font-weight: 600;
        }

        /* 图标预览 */
        .icon-preview {
            text-align: center;
            margin: 20px 0;
        }

        .icon-preview img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .icon-preview img:hover {
            transform: scale(1.02);
        }

        /* 状态消息 */
        .status {
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.9em;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        .status.success {
            background: #d5f4e6;
            color: #27ae60;
            border: 1px solid #2ecc71;
            opacity: 1;
            transform: translateY(0);
        }

        .status.error {
            background: #fdeaea;
            color: #e74c3c;
            border: 1px solid #e74c3c;
            opacity: 1;
            transform: translateY(0);
        }

        /* 页脚样式 */
        footer {
            background: #34495e;
            color: white;
            text-align: center;
            padding: 25px 20px;
            margin-top: 40px;
        }

        footer p {
            opacity: 0.8;
            font-size: 0.9em;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 20px;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            header h1 {
                font-size: 2em;
            }
            
            .card {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .container {
                border-radius: 15px;
            }
            
            .dashboard {
                padding: 15px;
            }
            
            header {
                padding: 30px 15px;
            }
            
            header h1 {
                font-size: 1.8em;
            }
        }

        /* 文件输入样式美化 */
        input[type="file"] {
            padding: 10px !important;
            background: white !important;
            border: 2px dashed #bdc3c7 !important;
            transition: all 0.3s ease;
        }

        input[type="file"]:hover {
            border-color: #3498db !important;
            background: #f8f9fa !important;
        }

        /* 数字输入框特殊样式 */
        #offsetInput {
            background: white !important;
            border: 2px solid #bdc3c7 !important;
        }

        #offsetInput:focus {
            border-color: #3498db !important;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1) !important;
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: fadeIn 0.6s ease-out;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #3498db, #2980b9);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #2980b9, #21618c);
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>文件管理系统</h1>
        <p class="subtitle">上传、下载和管理您的文件</p>
    </header>

    <div class="dashboard">
        <div class="card">
            <h2>文件信息</h2>
            <div class="file-info">
                <div class="file-icon">
                    <i>📄</i>
                </div>
                <div class="file-details">
                    <h3 id="fileName">暂无文件</h3>
                    <p id="fileStatus">请上传文件以开始使用</p>
                </div>
            </div>
            <div class="action-buttons">
                <button id="getInfoBtn" class="btn">获取文件信息</button>
                <button id="downloadBtn" class="btn btn-success">下载文件</button>
            </div>
            <div class="icon-preview">
                <img id="iconPreview" src="" alt="文件图标" style="display: none;">
            </div>
            <button id="getIconBtn" class="btn btn-block">获取文件图标</button>
        </div>

        <div class="card">
            <h2>文件上传</h2>
            <div class="form-group">
                <label for="fileInput">选择文件</label>
                <input type="file" id="fileInput" class="btn-block">
            </div>
            <div class="form-group">
                <label for="iconInput">选择图标 (可选)</label>
                <input type="file" id="iconInput" class="btn-block" accept="image/*">
            </div>
            <button id="uploadBtn" class="btn btn-block btn-success">上传文件</button>
            <div id="uploadStatus" class="status"></div>
        </div>

        <div class="card">
            <h2>文件修改</h2>
            <p>字符串长度不超过8</p>
            <div class="form-group">
                <label for="offsetInput">位置</label>
                <input type="number" id="offsetInput" min="0" value="0">
            </div>
            <div class="string-input-container">
                <label for="stringInput">修改字符串</label>
                <input type="text" id="stringInput" maxlength="8" placeholder="请输入最多8个字符">
                <div id="lengthIndicator" class="length-indicator">0/8</div>
            </div>
            <button id="modifyBtn" class="btn btn-block btn-warning">修改文件</button>
            <div id="modifyStatus" class="status"></div>
        </div>
    </div>

    <footer>
        <p>文件管理系统 &copy; 2025</p>
    </footer>
</div>

<script>
    // 全局变量，存储当前文件名
    let currentFileName = '';

    // DOM元素
    const fileInput = document.getElementById('fileInput');
    const iconInput = document.getElementById('iconInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    const getInfoBtn = document.getElementById('getInfoBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const getIconBtn = document.getElementById('getIconBtn');
    const modifyBtn = document.getElementById('modifyBtn');
    const fileNameElement = document.getElementById('fileName');
    const fileStatusElement = document.getElementById('fileStatus');
    const iconPreview = document.getElementById('iconPreview');
    const offsetInput = document.getElementById('offsetInput');
    const stringInput = document.getElementById('stringInput');
    const lengthIndicator = document.getElementById('lengthIndicator');
    const modifyStatus = document.getElementById('modifyStatus');

    // 页面加载时获取文件信息
    document.addEventListener('DOMContentLoaded', function() {
        getFileInfo();
    });

    // 获取文件信息
    async function getFileInfo() {
        try {
            const response = await fetch('/files/info');
            if (response.ok) {
                const data = await response.json();
                currentFileName = data.filename;
                updateFileInfoDisplay();
                showStatus(uploadStatus, `已加载文件: ${currentFileName}`, 'success');
            } else {
                currentFileName = '';
                updateFileInfoDisplay();
                showStatus(uploadStatus, '服务器上没有文件', 'error');
            }
        } catch (error) {
            console.error('获取文件信息失败:', error);
            showStatus(uploadStatus, '获取文件信息失败', 'error');
        }
    }

    // 更新文件信息显示
    function updateFileInfoDisplay() {
        if (currentFileName) {
            fileNameElement.textContent = currentFileName;
            fileStatusElement.textContent = '文件已就绪';
            fileNameElement.style.color = '#2ecc71';
        } else {
            fileNameElement.textContent = '暂无文件';
            fileStatusElement.textContent = '请上传文件以开始使用';
            fileNameElement.style.color = '#e74c3c';
        }
    }

    // 上传文件
    uploadBtn.addEventListener('click', async function() {
        if (!fileInput.files[0]) {
            showStatus(uploadStatus, '请选择要上传的文件', 'error');
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        if (iconInput.files[0]) {
            formData.append('icon', iconInput.files[0]);
        }

        try {
            const response = await fetch('/files/upload', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const result = await response.text();
                showStatus(uploadStatus, '文件上传成功', 'success');

                // 上传成功后更新文件信息
                await getFileInfo();
            } else {
                showStatus(uploadStatus, '文件修改失败', 'error');
            }
        } catch (error) {
            console.error('上传文件失败:', error);
            showStatus(uploadStatus, '上传文件失败', 'error');
        }
    });

    // 获取文件信息按钮
    getInfoBtn.addEventListener('click', getFileInfo);

    // 下载文件
    downloadBtn.addEventListener('click', function() {
        if (!currentFileName) {
            showStatus(uploadStatus, '没有可下载的文件', 'error');
            return;
        }

        // 创建隐藏的下载链接
        const downloadLink = document.createElement('a');
        downloadLink.href = '/files/download';
        downloadLink.download = currentFileName;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);

        showStatus(uploadStatus, '开始下载文件', 'success');
    });

    // 获取文件图标
    getIconBtn.addEventListener('click', function() {
        if (!currentFileName) {
            showStatus(uploadStatus, '没有文件图标可获取', 'error');
            return;
        }

        iconPreview.src = '/files/icon?' + new Date().getTime(); // 添加时间戳避免缓存
        iconPreview.style.display = 'block';
        showStatus(uploadStatus, '图标已加载', 'success');
    });

    // 修改文件
    modifyBtn.addEventListener('click', async function() {
        if (!currentFileName) {
            showStatus(modifyStatus, '请先上传文件', 'error');
            return;
        }

        const inputString = stringInput.value;
        if (!inputString) {
            showStatus(modifyStatus, '请输入要修改的字符串', 'error');
            return;
        }

        if (inputString.length > 8) {
            showStatus(modifyStatus, '字符串长度不能超过8个字符', 'error');
            return;
        }

        const offset = parseInt(offsetInput.value) || 0;
        if (offset < 0) {
            showStatus(modifyStatus, '偏移量不能为负数', 'error');
            return;
        }

        // Base64编码字符串
        let base64String;
        try {
            base64String = btoa(unescape(encodeURIComponent(inputString)));
        } catch (e) {
            showStatus(modifyStatus, '字符串编码失败', 'error');
            return;
        }

        // 创建修改请求数据
        const requestData = {
            fileName: currentFileName,
            offset: offset,
            data: base64String
        };

        try {
            const response = await fetch('/files/modify', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestData)
            });

            if (response.ok) {
                const result = await response.text();
                showStatus(modifyStatus, '文件修改成功', 'success');
            } else {
                const errorText = await response.text();
                showStatus(modifyStatus, `文件修改失败: ${errorText}`, 'error');
            }
        } catch (error) {
            console.error('修改文件失败:', error);
            showStatus(modifyStatus, '修改文件失败', 'error');
        }
    });

    // 显示状态消息
    function showStatus(element, message, type) {
        element.textContent = message;
        element.className = 'status ' + type;
        setTimeout(() => {
            element.className = 'status';
            element.style.display = 'none';
        }, 5000);
    }

    // 字符串输入框长度监控
    stringInput.addEventListener('input', function() {
        const length = this.value.length;
        lengthIndicator.textContent = `${length}/8`;
        
        if (length > 8) {
            lengthIndicator.classList.add('length-warning');
            this.value = this.value.substring(0, 8); // 强制截断
        } else {
            lengthIndicator.classList.remove('length-warning');
        }
    });

    // 限制输入长度（备用方案）
    stringInput.addEventListener('keydown', function(e) {
        if (this.value.length >= 8 && e.key !== 'Backspace' && e.key !== 'Delete' && 
            !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
        }
    });
</script>
</body>
</html>
