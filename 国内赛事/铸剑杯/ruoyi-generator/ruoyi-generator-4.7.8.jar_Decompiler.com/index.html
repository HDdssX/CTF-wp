<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>某个0元购商城系统</title>
    <link rel="stylesheet" href="/static/css/inter-font.css">
    <link rel="stylesheet" href="/static/css/fontawesome-local.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.2);
            width: 400px;
            position: relative;
            z-index: 10;
            animation: slideUp 0.8s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-container h2 {
            color: #2d3748;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            color: #718096;
            font-size: 14px;
            font-weight: 400;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 16px;
            z-index: 2;
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 400;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            outline: none;
        }

        .login-container input[type="text"]:focus,
        .login-container input[type="password"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: rgba(255, 255, 255, 1);
        }

        .login-container input[type="text"]:focus + i,
        .login-container input[type="password"]:focus + i {
            color: #667eea;
        }

        .login-container button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        .login-container button:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .login-container button:hover:before {
            left: 100%;
        }

        .login-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .login-container button:active {
            transform: translateY(0);
        }

        .shop-link {
            margin-top: 20px;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .shop-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .shop-link a:hover {
            color: #764ba2;
            transform: translateX(3px);
        }

        @media (max-width: 480px) {
            .login-container {
                width: 90%;
                padding: 30px 25px;
                margin: 20px;
            }
            
            .login-container h2 {
                font-size: 24px;
            }
        }

        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="particle" style="left: 10%; top: 20%; width: 10px; height: 10px; animation-delay: 0s;"></div>
        <div class="particle" style="left: 20%; top: 80%; width: 15px; height: 15px; animation-delay: 1s;"></div>
        <div class="particle" style="left: 60%; top: 30%; width: 8px; height: 8px; animation-delay: 2s;"></div>
        <div class="particle" style="left: 80%; top: 70%; width: 12px; height: 12px; animation-delay: 3s;"></div>
        <div class="particle" style="left: 30%; top: 10%; width: 6px; height: 6px; animation-delay: 4s;"></div>
        <div class="particle" style="left: 70%; top: 90%; width: 14px; height: 14px; animation-delay: 5s;"></div>
    </div>

    <div class="login-container">
        <div class="login-header">
            <h2>欢迎登录</h2>
            <p class="login-subtitle">请输入您的登录凭据</p>
        </div>
        
        <form onsubmit="return checkLogin()">
            <div class="input-group">
                <input type="text" id="username" placeholder="用户名" required>
                <i class="fas fa-user"></i>
            </div>
            
            <div class="input-group">
                <input type="password" id="password" placeholder="密码" required>
                <i class="fas fa-lock"></i>
            </div>
            
            <button type="submit">
                <span class="loading"></span>
                <span class="button-text">登录</span>
            </button>
        </form>
        
        <!-- <div class="shop-link">
            <a href="/shopayouwei">
                <i class="fas fa-shopping-cart"></i>
                不要你离开 距离隔不开
                思念变成海 在窗外进不来
                原谅说太快 爱成了阻碍
                手中的风筝放太快回不来
            </a>
        </div> -->
    </div>

    <script>
        function createParticles() {
            const container = document.querySelector('.background-animation');
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.width = (Math.random() * 10 + 5) + 'px';
                particle.style.height = particle.style.width;
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                container.appendChild(particle);
            }
        }

        function checkLogin() {
            const button = document.querySelector('button[type="submit"]');
            const loading = button.querySelector('.loading');
            const buttonText = button.querySelector('.button-text');
            
            loading.style.display = 'inline-block';
            buttonText.textContent = '登录中...';
            button.disabled = true;
            
            setTimeout(() => {
                const password = document.getElementById('password').value;
                const hardcodedPassword = '123456'; 

                if (password === hardcodedPassword) {
                    button.style.background = 'linear-gradient(135deg, #48bb78 0%, #38a169 100%)';
                    buttonText.textContent = '登录成功！';
                    loading.style.display = 'none';
                    
                    setTimeout(() => {
                        alert('带哌不老铁，登录成功！');
                    }, 500);
                    
                    return true;
                } else {
                    button.style.background = 'linear-gradient(135deg, #f56565 0%, #e53e3e 100%)';
                    buttonText.textContent = '密码错误';
                    loading.style.display = 'none';
                    
                    button.style.animation = 'shake 0.5s ease-in-out';
                    
                    setTimeout(() => {
                        button.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                        buttonText.textContent = '登录';
                        button.disabled = false;
                        button.style.animation = '';
                        alert('密码错误！');
                    }, 1000);
                    
                    return false;
                }
            }, 1000);
            
            return false;
        }

        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);

        window.addEventListener('load', createParticles);

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>

</body>
</html>
