<!doctype html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Monitor - Login</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
        input, button { padding: 8px; font-size: 14px; margin-top: 8px; display: block; width: 100%; box-sizing: border-box; }
        .out { background:#111; color:#0f0; padding:12px; white-space: pre-wrap; margin-top: 10px; }
    </style>
</head>
<body>

<h1>登录</h1>

<form id="loginForm">
    <input id="loginUsername" placeholder="用户名" required />
    <input id="loginPassword" type="password" placeholder="密码" required />
    <button type="submit">登录</button>
</form>

<p style="margin-top: 10px;">还没有账号？<a href="/register">去注册</a></p>


<script>
    const tokenKey = 'monitor_jwt';

    function setToken(t) {
        if (t) localStorage.setItem(tokenKey, t);
    }

    async function apiRequest(path, body) {
        const res = await fetch(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const txt = await res.text();
        try { return { status: res.status, data: JSON.parse(txt) }; }
        catch (e) { return { status: res.status, data: txt }; }
    }

    document.getElementById('loginForm').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const r = await apiRequest('/api/account/login', { username, password });
        // document.getElementById('output').textContent = JSON.stringify(r, null, 2);
        if (r?.data?.Authorization) {
            setToken(r.data.Authorization);

            // 解析 JWT Payload 获取真实身份
            try {
                const part = r.data.Authorization.split('.')[1];
                // 处理 Base64Url 编码
                const base64 = part.replace(/-/g, '+').replace(/_/g, '/');
                const payload = JSON.parse(atob(base64));

                if (payload.username === 'admin') {
                    location.href = '/admin';
                } else {
                    location.href = '/user';
                }
            } catch (e) {
                console.error("Token parse error", e);
                location.href = '/user';
            }
        } else {
            alert('Login failed: ' + (r.data?.response || r.data?.error || 'Unknown error'));
        }
    });
</script>
</body>
</html>
