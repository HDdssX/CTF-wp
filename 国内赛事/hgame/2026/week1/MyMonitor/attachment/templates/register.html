<!doctype html>
<html lang="zh">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Monitor - Register</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
        input, button { padding: 8px; font-size: 14px; margin-top: 8px; display: block; width: 100%; box-sizing: border-box; }
        .token { word-break: break-all; background:#f3f3f3; padding:8px; margin-top: 20px; }
        .out { background:#111; color:#0f0; padding:12px; white-space: pre-wrap; margin-top: 10px; }
    </style>
</head>
<body>

<h1>注册</h1>

<form id="registerForm">
    <input id="regUsername" placeholder="用户名" required />
    <input id="regPassword" type="password" placeholder="密码" required />
    <button type="submit">注册</button>
</form>

<p style="margin-top: 10px;">已有账号？<a href="/login">去登录</a></p>

<!--<div id="output" class="out">&#45;&#45; 无 &#45;&#45;</div>-->

<script>
    const tokenKey = 'monitor_jwt';

    function setToken(t) {
        if (t) localStorage.setItem(tokenKey, t);
    }

    async function apiRequest(path, body) {
        const res = await fetch(path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const txt = await res.text();
        try { return { status: res.status, data: JSON.parse(txt) }; }
        catch (e) { return { status: res.status, data: txt }; }
    }

    document.getElementById('registerForm').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        const r = await apiRequest('/api/account/register', { username, password });
        // document.getElementById('output').textContent = JSON.stringify(r, null, 2);
        if (r?.data?.Authorization) {
            setToken(r.data.Authorization);
            alert('Registration successful! Please login.');
            location.href = '/login';
        } else {
             alert('Registration failed: ' + (r.data?.response || r.data?.error || 'Unknown error'));
        }
    });
</script>
</body>
</html>
