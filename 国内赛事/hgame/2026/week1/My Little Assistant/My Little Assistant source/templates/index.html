<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI WEB Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-gradient { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); }
        .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        #chat-box::-webkit-scrollbar { width: 6px; }
        #chat-box::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="chat-gradient h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl h-[85vh] glass-effect rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-white">
        <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-white/50">
            <h1 class="text-lg font-semibold text-gray-700 flex items-center gap-2">
                <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span>
                WEB小助手
            </h1>
        </div>

        <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4 bg-gray-50/30">
            <div class="flex flex-col gap-1">
                <div class="bg-white border border-gray-100 text-gray-800 p-3 rounded-2xl rounded-tl-none shadow-sm max-w-[80%] text-sm">
                    我是集成 MCP 功能的 AI。我可以协助您做 WEB 题目。
                </div>
            </div>
        </div>

        <div class="p-4 bg-white border-t border-gray-100">
            <div class="relative flex items-center">
                <input type="text" id="userInput"
                    class="w-full p-3 pr-24 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all text-sm"
                    placeholder="开始对话吧！"
                    onkeypress="if(event.keyCode===13) send()">
                <button onclick="send()"
                    class="absolute right-2 px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm transition-colors shadow-lg">
                    发送
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');

        function addMessage(role, content, isSystem = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col gap-1 ${role === 'user' ? 'items-end' : 'items-start'}`;

            const msgDiv = document.createElement('div');
            if (isSystem) {
                msgDiv.className = "text-xs text-gray-400 italic my-2 px-2";
            } else {
                msgDiv.className = `p-3 rounded-2xl text-sm shadow-sm max-w-[85%] ${
                    role === 'user'
                    ? 'bg-blue-600 text-white rounded-tr-none'
                    : 'bg-white border border-gray-100 text-gray-800 rounded-tl-none'
                }`;
            }

            msgDiv.innerText = content;
            wrapper.appendChild(msgDiv);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function send() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage('user', message);
            input.value = '';

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await res.json();
                if (data.answer !== ""){
                    addMessage('ai', data.answer);
                }

                if (data.type === "tool_request") {
                    const confirmContent = `AI 申请使用工具：[${data.tool_name}]\n参数：${JSON.stringify(data.arguments)}\n是否允许执行？`;

                    if (confirm(confirmContent)) {
                        addMessage('system', `🚀 正在执行 ${data.tool_name}...`, true);

                        const toolRes = await fetch('/execute_tool', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name: data.tool_name, arguments: data.arguments })
                        });
                        const toolData = await toolRes.json();
                        if (toolData.code === 2) {
                            addMessage('ai', `⚠️ 工具执行异常：\n${toolData.result}`);
                        }
                        if (toolData.code === 1) {
                            addMessage('ai', `✅ 工具执行结果：\n${toolData.result}`);
                        }
                        if (toolData.code === 0) {
                            addMessage('ai', `❌ 工具执行失败：\n${toolData.result}`);
                        }
                    } else {
                        addMessage('system', "❌ 用户已拒绝调用", true);
                    }
                }
            } catch (e) {
                addMessage('system', "⚠️ 连接服务器失败，请确保后端已启动", true);
            }
        }
    </script>
</body>
</html>
